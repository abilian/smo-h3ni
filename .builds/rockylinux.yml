image: rockylinux/latest

packages:
  # Python
  - python3.11
  - python3.11-pip
  - python3.11-devel
  - python3.12
  - python3.12-pip
  - python3.12-devel
  # Build tools
  - make
  - gcc
  # - npm
  # Libraries
  - libpq-devel
  # Docker and friends (NB: docker is not available on Rocky Linux)
  - buildah
  # Dependencies for buildah
  - passt-selinux


tasks:
  - setup: |
      # Install nodejs 24.x
      # See: https://github.com/wey-gu/py-pglite/issues/22#issuecomment-2996124008
      curl -sL https://deb.nodesource.com/setup_24.x -o nodesource_setup.sh
      sudo bash nodesource_setup.sh
      sudo apt install nodejs
      # Install python pre-requisites
      sudo pip3.12 install -U uv nox
      cd smo-h3ni
      uv sync

  - lint: |
      cd smo-h3ni
      uv run make lint

  - test: |
      cd smo-h3ni
      uv run make test

  - nox: |
      cd smo-h3ni
      uv run nox -e pytest-3.12
      uv run nox -e pytest-3.11

  - buildah: |
      cd smo-h3ni
      buildah build -t smo .
